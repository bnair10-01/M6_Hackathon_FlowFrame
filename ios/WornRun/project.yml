name: WornRun
options:
  bundleIdPrefix: com.stevencastro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9496L7QUB2
    CODE_SIGN_STYLE: Automatic
targets:
  WornRun:
    type: application
    platform: iOS
    sources: [WornRun]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevencastro.wornrun
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: WornRun/Info.plist
      properties:
        CFBundleDisplayName: Worn Run
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Worn Run connects to your glasses to show your run on the display.
        NSLocationWhenInUseUsageDescription: Worn Run sends your location to your glasses for pace, distance and directions.
        NSLocationAlwaysAndWhenInUseUsageDescription: Worn Run keeps sending your location to your glasses while the phone is in your pocket.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
  WornRunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WornRunTests]
    dependencies:
      - target: WornRun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.stevencastro.wornrun.tests
schemes:
  WornRun:
    build:
      targets:
        WornRun: all
        WornRunTests: [test]
    test:
      targets: [WornRunTests]
