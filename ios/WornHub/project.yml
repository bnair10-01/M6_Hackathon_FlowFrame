name: WornHub
options:
  bundleIdPrefix: com.stevencastro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9496L7QUB2
    CODE_SIGN_STYLE: Automatic
targets:
  WornHub:
    type: application
    platform: iOS
    sources:
      - WornHub
      # Companion screens: compiled from the standalone apps' sources.
      - path: ../WornRun/WornRun
        group: Companions/WornRun
        excludes: [WornRunApp.swift, Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevencastro.wornhub
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: WornHub/Info.plist
      properties:
        CFBundleDisplayName: Worn Hub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [bluetooth-central, location]
        NSBluetoothAlwaysUsageDescription: Worn Hub connects to your glasses to show their status and open apps on them.
        NSLocalNetworkUsageDescription: Worn Hub shows your glasses' camera and their photos and videos over your Wi-Fi.
        NSPhotoLibraryAddUsageDescription: Worn Hub saves photos and videos from your glasses to your library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Worn Run companion.
        NSLocationWhenInUseUsageDescription: Worn Run sends your location to your glasses for pace, distance and directions.
        NSLocationAlwaysAndWhenInUseUsageDescription: Worn Run keeps sending your location to your glasses while the phone is in your pocket.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
  WornHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WornHubTests]
    dependencies:
      - target: WornHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.stevencastro.wornhub.tests
schemes:
  WornHub:
    build:
      targets:
        WornHub: all
        WornHubTests: [test]
    test:
      targets: [WornHubTests]
